    <!-- сердечко -->
    <path fill="url(#heart)"
          d="M16 24 C 9 19, 6.5 15.5, 6.5 12.5 C 6.5 10, 8.5 8, 11 8 C 13 8, 14.5 9.3, 16 11 C 17.5 9.3, 19 8, 21 8 C 23.5 8, 25.5 10, 25.5 12.5 C 25.5 15.5, 23 19, 16 24 Z"/>
